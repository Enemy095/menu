spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/emenu}
    username: ${DATABASE_USERNAME:emenu}
    password: ${DATABASE_PASSWORD:emenu_local_password}

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

app:
  security:
    cors:
      allowed-origins: '${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}'
    request-authority:
      allowed-hosts: '${APP_SECURITY_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}'
    trusted-proxies:
      enabled: false
      cidrs: []
  assets:
    storage:
      endpoint: ${ASSET_STORAGE_ENDPOINT:http://localhost:9000}
      region: ${ASSET_STORAGE_REGION:us-east-1}
      bucket: ${ASSET_STORAGE_BUCKET:menu-assets-local}
      access-key: ${ASSET_STORAGE_ACCESS_KEY:emenu-local}
      secret-key: ${ASSET_STORAGE_SECRET_KEY:emenu-local-password}
      path-style-access: ${ASSET_STORAGE_PATH_STYLE_ACCESS:true}
    cdn-base-url: ${ASSET_BASE_URL:http://localhost:9000/menu-assets-local}
  external:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
    asset-base-url: ${ASSET_BASE_URL:http://localhost:9000/menu-assets-local}
