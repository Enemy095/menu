spring:
  application:
    name: menu-platform-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    env:
      access: none
    configprops:
      access: none
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

app:
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
    request-authority:
      allowed-hosts: ${APP_SECURITY_ALLOWED_HOSTS:}
    trusted-proxies:
      enabled: ${APP_SECURITY_TRUSTED_PROXIES_ENABLED:false}
      cidrs: ${APP_SECURITY_TRUSTED_PROXY_CIDRS:}
    rate-limit:
      client:
        tokens-per-period: ${ORDER_RATE_LIMIT_CLIENT_TOKENS_PER_MINUTE:5}
        period: 1m
        burst-capacity: ${ORDER_RATE_LIMIT_CLIENT_BURST:10}
      application:
        tokens-per-period: ${ORDER_RATE_LIMIT_APPLICATION_TOKENS_PER_MINUTE:120}
        period: 1m
        burst-capacity: ${ORDER_RATE_LIMIT_APPLICATION_BURST:240}
      cache:
        maximum-client-buckets: ${ORDER_RATE_LIMIT_MAX_CLIENT_BUCKETS:50000}
        expire-after-access: ${ORDER_RATE_LIMIT_BUCKET_EXPIRY:10m}
  assets:
    storage:
      endpoint: ${ASSET_STORAGE_ENDPOINT}
      region: ${ASSET_STORAGE_REGION:us-east-1}
      bucket: ${ASSET_STORAGE_BUCKET}
      access-key: ${ASSET_STORAGE_ACCESS_KEY}
      secret-key: ${ASSET_STORAGE_SECRET_KEY}
      path-style-access: ${ASSET_STORAGE_PATH_STYLE_ACCESS:false}
    cdn-base-url: ${ASSET_BASE_URL}
  worker:
    enabled: ${APP_WORKER_ENABLED:false}
    worker-id: ${APP_WORKER_ID:${random.uuid}}
    poll-interval: ${APP_WORKER_POLL_INTERVAL:1s}
    batch-size: ${APP_WORKER_BATCH_SIZE:20}
    concurrency: ${APP_WORKER_CONCURRENCY:4}
    max-destinations: ${APP_WORKER_MAX_DESTINATIONS:2}
    lease-duration: ${APP_WORKER_LEASE_DURATION:1m}
    provider-timeout: ${APP_WORKER_PROVIDER_TIMEOUT:20s}
    max-attempts: ${APP_WORKER_MAX_ATTEMPTS:10}
    initial-backoff: ${APP_WORKER_INITIAL_BACKOFF:5s}
    max-backoff: ${APP_WORKER_MAX_BACKOFF:15m}
    jitter-ratio: ${APP_WORKER_JITTER_RATIO:0.2}
    shutdown-timeout: ${APP_WORKER_SHUTDOWN_TIMEOUT:30s}
  external:
    public-base-url: ${PUBLIC_BASE_URL}
    asset-base-url: ${ASSET_BASE_URL}
