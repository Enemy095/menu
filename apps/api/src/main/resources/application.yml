spring:
  application:
    name: menu-platform-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    env:
      access: none
    configprops:
      access: none
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

app:
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
    rate-limit:
      client:
        tokens-per-period: ${ORDER_RATE_LIMIT_CLIENT_TOKENS_PER_MINUTE:5}
        period: 1m
        burst-capacity: ${ORDER_RATE_LIMIT_CLIENT_BURST:10}
      tenant:
        tokens-per-period: ${ORDER_RATE_LIMIT_TENANT_TOKENS_PER_MINUTE:120}
        period: 1m
        burst-capacity: ${ORDER_RATE_LIMIT_TENANT_BURST:240}
      cache:
        maximum-client-buckets: ${ORDER_RATE_LIMIT_MAX_CLIENT_BUCKETS:50000}
        maximum-tenant-buckets: ${ORDER_RATE_LIMIT_MAX_TENANT_BUCKETS:5000}
        expire-after-access: ${ORDER_RATE_LIMIT_BUCKET_EXPIRY:10m}
  assets:
    storage:
      endpoint: ${ASSET_STORAGE_ENDPOINT}
      region: ${ASSET_STORAGE_REGION:us-east-1}
      bucket: ${ASSET_STORAGE_BUCKET}
      access-key: ${ASSET_STORAGE_ACCESS_KEY}
      secret-key: ${ASSET_STORAGE_SECRET_KEY}
      path-style-access: ${ASSET_STORAGE_PATH_STYLE_ACCESS:false}
    cdn-base-url: ${ASSET_BASE_URL}
  platform:
    hosts:
      base-domain: ${PLATFORM_BASE_DOMAIN}
      allowed-hosts: ${PLATFORM_ALLOWED_HOSTS}
      local-aliases: ${PLATFORM_LOCAL_ALIASES:}
    trusted-forwarding:
      enabled: ${TRUSTED_FORWARDING_ENABLED:false}
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  worker:
    enabled: ${APP_WORKER_ENABLED:false}
  external:
    public-base-url: ${PUBLIC_BASE_URL}
    asset-base-url: ${ASSET_BASE_URL}
