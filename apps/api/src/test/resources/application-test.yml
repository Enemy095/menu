spring:
  config:
    activate:
      on-profile: test

app:
  platform:
    hosts:
      base-domain: example.test
      allowed-hosts:
        - example.test
        - tenant.example.test
    trusted-forwarding:
      enabled: false
      trusted-proxy-cidrs: []
  worker:
    enabled: false
  external:
    public-base-url: https://example.test
    asset-base-url: https://assets.example.test

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
