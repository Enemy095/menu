spring:
  config:
    activate:
      on-profile: test

app:
  assets:
    storage:
      endpoint: http://127.0.0.1:1
      region: us-east-1
      bucket: tenant-assets-test
      access-key: test-access-key
      secret-key: test-secret-key
      path-style-access: true
    cdn-base-url: https://assets.example.test
  platform:
    hosts:
      base-domain: example.test
      allowed-hosts:
        - example.test
        - tenant.example.test
      local-aliases:
        - localhost
        - 127.0.0.1
        - '::1'
    trusted-forwarding:
      enabled: false
      trusted-proxy-cidrs: []
  worker:
    enabled: false
  external:
    public-base-url: https://example.test
    asset-base-url: https://assets.example.test

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
